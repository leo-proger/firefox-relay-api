[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firefox-relay-api"
version = "0.1.0"
description = "Unofficial Python client for Firefox Relay"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Leo Proger", email = "leoproger11@gmail.com" }]
keywords = ["firefox", "relay", "email", "privacy", "alias", "mask"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/leo-proger/firefox-relay-api"
Issues = "https://github.com/leo-proger/firefox-relay-api/issues"
Repository = "https://github.com/leo-proger/firefox-relay-api"

[tool.hatch.build.targets.wheel]
packages = ["src/firefox_relay"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/firefox_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
